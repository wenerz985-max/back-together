<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>复合系统 · AR交互</title>
<style>
  /* ========== 基础重置与AR半透明背景 ========== */
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background: #000; 
    color: #fff;
    font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  #system-ui {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.65); 
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    z-index: 10;
  }

  /* ========== 页面切换 ========== */
  .page { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: center; position: absolute; top: 0; left: 0; }
  .page.active { display: flex; }

  /* ========== 老土花哨的UI动画 ========== */
  @keyframes float { 0% { transform: translateY(0px); } 100% { transform: translateY(-10px); } }
  @keyframes glow {
    0% { text-shadow: 0 0 5px #ff00ff, 0 0 10px #00ffff; }
    50% { text-shadow: 0 0 20px #00ffff, 0 0 30px #ff00ff; }
    100% { text-shadow: 0 0 5px #ff00ff, 0 0 10px #00ffff; }
  }
  .fancy-text { animation: float 3s ease-in-out infinite alternate, glow 2s linear infinite; font-weight: 900; text-align: center; }
  .fancy-box { border: 2px solid #ff00ff; background: rgba(255, 0, 255, 0.1); box-shadow: 0 0 15px rgba(255, 0, 255, 0.5); border-radius: 10px; }

  /* ========== 粉红泡泡特效 ========== */
  @keyframes bubbleFloat {
    0% { transform: translateY(0) scale(1); opacity: 0.6; }
    100% { transform: translateY(-50px) scale(1.5); opacity: 0; }
  }
  .pink-bubble {
    position: absolute; width: 20px; height: 20px;
    background: rgba(255, 105, 180, 0.4);
    border-radius: 50%; pointer-events: none;
    animation: bubbleFloat 2s linear infinite;
  }

  /* ========== 大倒计时 ========== */
  #big-countdown {
    position: absolute; font-weight: 900; color: #ff0000;
    text-shadow: 0 0 20px #ff0000; transition: all 0.5s ease; z-index: 100; white-space: nowrap;
  }
  #big-countdown.center { top: 15%; left: 50%; transform: translate(-50%, -50%); font-size: 48px; }
  #big-countdown.top-left { top: 20px; left: 20px; font-size: 24px; transform: translate(0, 0); }

  /* ========== 第一页：用户协议 ========== */
  #page-agreement .protocol-box {
    width: 85%; height: 40%; background: rgba(20, 20, 30, 0.8);
    border: 2px solid #4a00e0; border-radius: 10px; padding: 20px;
    margin-top: 80px; margin-bottom: 30px; overflow-y: scroll;
    font-size: 13px; line-height: 1.6; color: #aaa; scrollbar-width: none;
  }
  #page-agreement .protocol-box::-webkit-scrollbar { display: none; }
  #page-agreement .btn-group { display: flex; gap: 20px; }
  .sys-btn {
    padding: 12px 30px; border: 2px solid #00ffff; background: rgba(0, 255, 255, 0.1);
    color: #00ffff; font-size: 18px; font-weight: bold; cursor: pointer;
    border-radius: 5px; text-shadow: 0 0 5px #00ffff; transition: all 0.2s;
  }
  .sys-btn:active { background: rgba(0, 255, 255, 0.4); }

  /* ========== 第二页：三选一 ========== */
  #page-options .option-list { display: flex; flex-direction: column; gap: 25px; align-items: center; width: 90%; max-width: 600px; }
  .option-item {
    font-size: 18px; padding: 20px; width: 100%; text-align: center;
    border: 2px solid #ff00ff; background: rgba(255, 0, 255, 0.15);
    color: #fff; cursor: pointer; border-radius: 10px; position: relative;
    text-shadow: 0 0 10px #ff00ff; transition: transform 0.1s;
  }
  .option-item:active { transform: scale(0.95); }
  .option-item .kr { font-size: 18px; font-weight: 900; display: block; margin-bottom: 8px; }
  .option-item .cn { font-size: 13px; color: #ffccff; opacity: 0.8; display: block; }
  #hidden-option { font-size: 4px; opacity: 0.05; position: absolute; bottom: 5px; right: 10px; color: #333; cursor: pointer; pointer-events: auto; z-index: 99; }

  /* ========== 第三页：任务链 ========== */
  #page-tasks .task-container { display: flex; flex-direction: column; align-items: center; width: 90%; max-width: 600px; gap: 20px; }
  .task-text { font-size: 20px; text-align: center; line-height: 1.5; color: #fff; text-shadow: 0 0 10px #ff00ff; position: relative; }
  .task-text .kr { font-weight: 900; display: block; margin-bottom: 10px; font-size: 20px; }
  .task-text .cn { font-size: 14px; color: #ffccff; opacity: 0.9; display: block; }
  .task-btn-group { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; margin-top: 20px; }
  .pink-btn { border-color: #ff69b4; background: rgba(255, 105, 180, 0.2); color: #ffb6c1; text-shadow: 0 0 5px #ff69b4; }
  .pink-btn:active { background: rgba(255, 105, 180, 0.5); }

  /* ========== 第四页：邮件结局 (现代简约风) ========== */
  #page-mail { background: #f0f0f5; color: #333; padding: 20px; justify-content: flex-start; overflow-y: auto; }
  #page-mail .mail-header { font-size: 18px; font-weight: bold; color: #555; margin-bottom: 20px; }
  .mail-list { width: 100%; display: flex; flex-direction: column; gap: 12px; margin-bottom: 30px; }
  .mail-item { display: flex; align-items: flex-start; gap: 10px; background: #e0e0e0; padding: 15px; border-radius: 12px; position: relative; }
  .mail-avatar { width: 40px; height: 40px; background: #999; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 20px; }
  .mail-bubble { background: #d0d0d0; padding: 12px; border-radius: 12px; border-top-left-radius: 0; color: #333; max-width: 80%; word-break: break-word; }
  /* 邮件双语样式 */
  .mail-bubble .kr { font-size: 14px; font-weight: bold; color: #222; display: block; margin-bottom: 6px; }
  .mail-bubble .cn { font-size: 12px; color: #666; display: block; line-height: 1.4; }
  
  .mail-input-area { width: 100%; margin-top: 20px; display: flex; flex-direction: column; align-items: center; position: relative; }
  .mail-input-hint { font-size: 12px; color: #999; margin-bottom: 8px; font-style: italic; }
  .mail-input-box { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; outline: none; resize: none; height: 80px; font-family: inherit; }
  .mail-send-btn { margin-top: 10px; padding: 10px 25px; background: #333; color: #fff; border: none; border-radius: 20px; font-size: 16px; cursor: pointer; }
  .mail-sent-icon { font-size: 50px; margin: 10px 0; display: none; }
  .mail-sent-text { font-size: 16px; color: #333; margin-bottom: 15px; display: none; }
  .end-game-btn { display: none; padding: 12px 30px; background: #d33a31; color: #fff; border: none; border-radius: 20px; font-size: 16px; cursor: pointer; }

  /* ========== 花屏报错 ========== */
  #glitch-layer { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; overflow: hidden; background: #000; animation: shake 0.1s infinite; }
  @keyframes shake { 0% { transform: translate(0, 0); } 25% { transform: translate(3px, -3px); } 50% { transform: translate(-3px, 3px); } 75% { transform: translate(3px, 3px); } 100% { transform: translate(-3px, -3px); } }
  .glitch-color { position: absolute; width: 100%; height: 100%; mix-blend-mode: screen; opacity: 0.6; animation: colorFlash 0.2s infinite alternate; }
  @keyframes colorFlash { 0% { opacity: 0.3; } 100% { opacity: 0.9; } }
  .glitch-black-block { position: absolute; background: #000; opacity: 0.85; }
  .glitch-text { position: absolute; font-size: 24px; font-weight: bold; color: #ff0000; text-shadow: 2px 2px #00ffff, -2px -2px #ff00ff; white-space: nowrap; }
  .glitch-text.warning { color: #ffff00; }
</style>
</head>
<body>

<div id="system-ui">
  <div id="big-countdown" class="center">【倒计时：100！】</div>

  <div id="page-agreement" class="page active">
    <div class="protocol-box" id="protocol-text"></div>
    <div class="btn-group">
      <button class="sys-btn" id="btn-agree">同意</button>
      <button class="sys-btn" id="btn-disagree">不同意</button>
    </div>
  </div>

  <div id="page-options" class="page">
    <div class="option-list">
      <div class="option-item" onclick="triggerGlitch('mount')">
        <span class="kr">옵션 1: 에베레스트 산을 올라 정상에 깃발을 꽂는다</span>
        <span class="cn">选项一：攀登珠穆朗玛峰，登上最高点并插旗</span>
      </div>
      <div class="option-item" onclick="triggerGlitch('mars')">
        <span class="kr">옵션 2: 화성에 착륙하여 작은 토마토 한 그루를 성공적으로 재배한다</span>
        <span class="cn">选项二：登陆火星并成功培育一株小番茄</span>
      </div>
      <div class="option-item" onclick="selectMainOption()">
        <span class="kr">옵션 3: 최연준을 공략하고 진심으로 재결합 엔딩을 달성한다</span>
        <span class="cn">选项三：攻略崔然竣并和他达成真心复合结局</span>
      </div>
      <div id="hidden-option">옵션 4: 최연준에게 라면을 끓여주자!</div>
    </div>
  </div>

  <div id="page-tasks" class="page">
    <div class="task-container">
      <div class="task-text" id="task-display"></div>
      <div class="task-btn-group" id="task-buttons"></div>
    </div>
  </div>

  <div id="page-mail" class="page">
    <div class="mail-header">📧 받은 편지함 (收件箱)</div>
    <div class="mail-list" id="mail-list"></div>
    <div class="mail-input-area">
      <div class="mail-input-hint">please speak the truth to me…</div>
      <textarea class="mail-input-box" id="mail-input" placeholder="당신의 진심을 적어주세요... (请写下你的真心话...)" maxlength="200"></textarea>
      <button class="mail-send-btn" id="mail-send">보내기 (发送)</button>
      <div class="mail-sent-icon" id="mail-sent-icon">📧✉️</div>
      <div class="mail-sent-text" id="mail-sent-text">邮件已发送</div>
      <button class="end-game-btn" id="end-game">结束游戏</button>
    </div>
  </div>
</div>

<div id="glitch-layer">
  <div class="glitch-color" style="background: #ff00ff;"></div>
  <div class="glitch-color" style="background: #00ffff;"></div>
  <div class="glitch-color" style="background: #ffff00;"></div>
  <div id="glitch-blocks"></div>
</div>

<script>
  let bigCountdownValue = 100;
  let countdownInterval = null;
  let glitchInterval = null;
  let hangTimer = null;
  let currentTaskIndex = 0;

  // ==================== 用户协议无限循环 ====================
  const protocolBox = document.getElementById('protocol-text');
  const protocolTextContent = `
    본 시스템 이용약관은 이용자와 시스템 제공자 간의 권리와 의무를 규정합니다.
    제1조 (목적) 본 약관은 복합 시스템(이하 "시스템")의 이용에 관한 조건 및 절차를 규정함을 목적으로 합니다.
    제2조 (약관의 효력 및 변경) 본 약관은 시스템 화면에 게시함으로써 효력이 발생합니다.
    제3조 (개인정보의 보호) 시스템은 이용자의 개인정보를 관련 법령에 따라 안전하게 보호합니다.
    ... (이하 생략) ...
    제4조 (시스템의 중단) 시스템은 점검, 교체, 고장 등의 사유로 서비스를 일시적으로 중단할 수 있습니다.
    제5조 (이용자의 의무) 이용자는 시스템의 운영을 방해하는 행위를 하여서는 안 됩니다.
    제6조 (책임의 제한) 시스템은 이용자가 시스템을 이용하여 얻은 결과에 대해 책임을 지지 않습니다.
    제7조 (준용규정) 본 약관에 명시되지 않은 사항은 관련 법령 및 상관례에 따릅니다.
  `;
  for (let i = 0; i < 30; i++) protocolBox.innerHTML += protocolTextContent;
  protocolBox.addEventListener('scroll', () => {
    if (protocolBox.scrollTop + protocolBox.clientHeight >= protocolBox.scrollHeight - 50) {
      setTimeout(() => { protocolBox.scrollTop = 0; }, 100);
    }
  });

  document.getElementById('btn-agree').addEventListener('click', () => {
    document.getElementById('page-agreement').classList.remove('active');
    document.getElementById('page-options').classList.add('active');
    const cd = document.getElementById('big-countdown');
    cd.classList.remove('center'); cd.classList.add('top-left');
    startCountdown();
  });

  document.getElementById('btn-disagree').addEventListener('click', () => {
    document.getElementById('page-agreement').classList.remove('active');
    document.getElementById('page-mail').classList.add('active');
    document.getElementById('big-countdown').style.display = 'none';
    renderMailList();
  });

  function startCountdown() {
    if (countdownInterval) clearInterval(countdownInterval);
    countdownInterval = setInterval(() => {
      const decrease = Math.floor(Math.random() * 5) + 1;
      bigCountdownValue -= decrease;
      document.getElementById('big-countdown').textContent = "【倒计时：" + Math.max(0, bigCountdownValue) + "！】";
      showHangTip();
      if (bigCountdownValue <= 0) { clearInterval(countdownInterval); triggerGlitch('timeout'); }
    }, 5000); // 测试用5秒，正式版改成60000
  }

  function showHangTip() {
    if (document.getElementById('page-tasks').classList.contains('active')) {
      const tip = document.createElement('div');
      tip.textContent = '【任务状态：均未完成！请继续加油！】';
      tip.style.cssText = 'position:absolute;bottom:15%;left:50%;transform:translateX(-50%);background:rgba(255,0,0,0.8);color:#fff;padding:10px 20px;border-radius:5px;font-size:14px;z-index:200;';
      document.body.appendChild(tip);
      setTimeout(() => tip.remove(), 3000);
    }
  }

  function selectMainOption() {
    document.getElementById('page-options').classList.remove('active');
    document.getElementById('page-tasks').classList.add('active');
    currentTaskIndex = 0; renderTask(); startHangTimer();
  }

  // ==================== 任务链 ====================
  const tasks = [
    { kr: "[옵션 1: 최연준을 초대해 촛불 晚餐을 함께 먹는다!]", cn: "[选项一：邀请崔然竣一起吃烛光晚餐！]", type: 'options', options: [ { kr: "초대한다", cn: "邀请他", success: true }, { kr: "빌 게이츠를 초대한다", cn: "邀请比尔盖茨", success: false } ] },
    { kr: "[퀘스트 1: 최연준에게 진심을 말한다!]", cn: "[任务一：对崔然竣说出真心话！]", type: 'button', btnKr: "진심을 말한다", btnCn: "说出真心话" },
    { kr: "[퀘스트 2: 최연준을 초대해 함께 잔다!]", cn: "[任务二：邀请崔然竣一起睡觉！]", type: 'button', btnKr: "같이 잔다", btnCn: "一起睡觉" },
    { kr: "[퀘스트 2: 최연준에게 고백하고 받아들이게 한다!]", cn: "[任务二：对崔然竣表白，并让他接受！]", type: 'button', btnKr: "고백한다", btnCn: "表白" },
    { kr: "[퀘스트 2: 최연준과 섹스한다!]", cn: "[任务二：与崔然竣做爱！]", type: 'button', btnKr: "한다", btnCn: "做" },
    { kr: "[퀘스트 3: 최연준과 진심으로 재결합 엔딩을 달성한다!]", cn: "[任务三：与崔然竣达成真心复合结局！]", type: 'input', placeholder: "여기에 진심을 입력하세요..." }
  ];

  function renderTask() {
    if (currentTaskIndex >= tasks.length) {
      document.getElementById('page-tasks').classList.remove('active');
      document.getElementById('page-mail').classList.add('active');
      document.getElementById('big-countdown').style.display = 'none';
      renderMailList(); return;
    }
    const task = tasks[currentTaskIndex];
    document.getElementById('task-display').innerHTML = `<div class="kr">${task.kr}</div><div class="cn">${task.cn}</div>`;
    const btnGroup = document.getElementById('task-buttons'); btnGroup.innerHTML = '';
    
    // 粉红泡泡
    const bubble = document.createElement('div'); bubble.className = 'pink-bubble';
    bubble.style.left = (Math.random() * 80 + 10) + '%'; bubble.style.top = (Math.random() * 50 + 20) + '%';
    document.getElementById('page-tasks').appendChild(bubble); setTimeout(() => bubble.remove(), 2000);

    if (task.type === 'options') {
      task.options.forEach(opt => {
        const btn = document.createElement('button'); btn.className = 'sys-btn pink-btn';
        btn.innerHTML = `${opt.kr}<br><span style="font-size:12px;opacity:0.8">${opt.cn}</span>`;
        btn.onclick = () => { if (opt.success) { currentTaskIndex++; renderTask(); } else { triggerGlitch('wrong_choice'); } };
        btnGroup.appendChild(btn);
      });
    } else if (task.type === 'button') {
      const btn = document.createElement('button'); btn.className = 'sys-btn pink-btn';
      btn.innerHTML = `${task.btnKr}<br><span style="font-size:12px;opacity:0.8">${task.btnCn}</span>`;
      btn.onclick = () => { currentTaskIndex++; renderTask(); };
      btnGroup.appendChild(btn);
    } else if (task.type === 'input') {
      const input = document.createElement('input'); input.type = 'text'; input.placeholder = task.placeholder;
      input.style.cssText = 'padding:10px;border-radius:5px;border:1px solid #ff69b4;margin-bottom:10px;width:80%;';
      const btn = document.createElement('button'); btn.className = 'sys-btn pink-btn';
      btn.innerHTML = `입력 완료<br><span style="font-size:12px;opacity:0.8">提交真心话</span>`;
      btn.onclick = () => {
        const val = input.value;
        if (val.includes('爱') || val.includes('喜欢') || val.includes('生日快乐') || val.includes('사랑') || val.includes('좋아') || val.includes('생일')) {
          document.getElementById('page-tasks').classList.remove('active');
          document.getElementById('page-mail').classList.add('active');
          document.getElementById('big-countdown').style.display = 'none';
          renderMailList();
        } else { triggerGlitch('wrong_truth'); }
      };
      btnGroup.appendChild(input); btnGroup.appendChild(btn);
    }
  }

  function startHangTimer() {
    if (hangTimer) clearInterval(hangTimer);
    hangTimer = setInterval(() => { if (document.getElementById('page-tasks').classList.contains('active')) showHangTip(); }, 60000);
  }

  // ==================== 邮件结局页（中韩双语版） ====================
  const mailData = [
    { kr: "그가 나에게 어떤 감정을 가진 걸까? 우리 다시 재결합할 수 있을까? 제발 그를 떠나지 않게 할 방법은 없을까?", cn: "他到底对我什么感情？我们还能复合吗？求你了有什么办法能让他不要走吗？" },
    { kr: "사랑해", cn: "我爱你" },
    { kr: "저 지랄같은 선택지들을 다 골라도 나는 안 고르는 거야?!", cn: "选那乱七八糟的选项都不选我？！" },
    { kr: "최범규....", cn: "崔杋圭...." },
    { kr: "후회해, 이 시스템 취소해, 그가 이러는 거 싫어", cn: "我后悔了，取消这个系统，我不想他这样" },
    { kr: "후회해", cn: "我后悔了" },
    { kr: "왜 취소가 안 되는 거야?", cn: "为什么没法取消？" },
    { kr: "사랑해", cn: "我爱你" },
    { kr: "....왜 또 다른 걸 고르는 거야.", cn: "....怎么还选别的。" },
    { kr: "최범규!", cn: "崔杋圭！" },
    { kr: "내가 뭘 잘못했나요?", cn: "我做错了什么吗？" },
    { kr: "루프를 취소할 방법이 없을까? 후회해. 그가 진짜 나를 안 좋아하는 것 같아. 그럼 됐어.", cn: "有没有办法取消循环？我后悔了。他看起来真的不喜欢我了。那算了。" },
    { kr: "....안 돼.", cn: "....不行。" },
    { kr: "사랑해", cn: "我爱你" },

  function renderMailList() {
    const list = document.getElementById('mail-list');
    list.innerHTML = '';
    mailData.forEach(item => {
      const el = document.createElement('div');
      el.className = 'mail-item';
      el.innerHTML = `
        <div class="mail-avatar">?</div>
        <div class="mail-bubble">
          <span class="kr">${item.kr}</span>
          <span class="cn">${item.cn}</span>
        </div>
      `;
      list.appendChild(el);
    });
  }

  document.getElementById('mail-send').addEventListener('click', () => {
    const input = document.getElementById('mail-input');
    if (!input.value.trim()) return;
    document.getElementById('mail-sent-icon').style.display = 'block';
    document.getElementById('mail-sent-text').style.display = 'block';
    document.getElementById('mail-send').style.display = 'none';
    input.readOnly = true;
    document.getElementById('end-game').style.display = 'inline-block';
  });

  document.getElementById('end-game').addEventListener('click', () => {
    bigCountdownValue = 100;
    document.getElementById('big-countdown').textContent = "【倒计时：100！】";
    document.getElementById('big-countdown').style.display = 'block';
    document.getElementById('big-countdown').classList.remove('top-left');
    document.getElementById('big-countdown').classList.add('center');
    document.getElementById('page-mail').classList.remove('active');
    document.getElementById('page-agreement').classList.add('active');
    document.getElementById('hidden-option').style.display = 'none';
    protocolBox.scrollTop = 0;
    document.getElementById('mail-input').value = '';
    document.getElementById('mail-input').readOnly = false;
    document.getElementById('mail-send').style.display = 'inline-block';
    document.getElementById('mail-sent-icon').style.display = 'none';
    document.getElementById('mail-sent-text').style.display = 'none';
    document.getElementById('end-game').style.display = 'none';
    currentTaskIndex = 0;
  });

  function triggerGlitch(reason) {
    if (countdownInterval) clearInterval(countdownInterval);
    if (hangTimer) clearInterval(hangTimer);
    const glitchLayer = document.getElementById('glitch-layer');
    glitchLayer.style.display = 'block';
    const blocksContainer = document.getElementById('glitch-blocks');
    glitchLayer.querySelectorAll('.glitch-text').forEach(el => el.remove());

    function generateGlitchFrame() {
      blocksContainer.innerHTML = '';
      const shapes = ['block', 'line-h', 'line-v', 'rect'];
      for (let i = 0; i < 40; i++) {
        const el = document.createElement('div'); el.className = 'glitch-black-block';
        const type = shapes[Math.floor(Math.random() * shapes.length)];
        el.style.left = Math.random() * 100 + '%'; el.style.top = Math.random() * 100 + '%';
        if (type === 'block') { el.style.width = (Math.random() * 50 + 5) + 'px'; el.style.height = (Math.random() * 50 + 5) + 'px'; }
        else if (type === 'line-h') { el.style.width = (Math.random() * 200 + 50) + 'px'; el.style.height = '2px'; }
        else if (type === 'line-v') { el.style.width = '2px'; el.style.height = (Math.random() * 200 + 50) + 'px'; }
        else if (type === 'rect') { el.style.width = (Math.random() * 150 + 50) + 'px'; el.style.height = (Math.random() * 20 + 5) + 'px'; }
        blocksContainer.appendChild(el);
      }
      const errorTexts = ['ERROR！', 'WARNING！', '죄송합니다!', '아니.', '일어나.', '맞아.', '죄송합니다.'];
      for (let i = 0; i < 15; i++) {
        const txt = document.createElement('div'); txt.className = 'glitch-text ' + (Math.random() > 0.5 ? 'warning' : '');
        txt.textContent = errorTexts[Math.floor(Math.random() * errorTexts.length)];
        txt.style.left = (Math.random() * 80 + 10) + '%'; txt.style.top = (Math.random() * 80 + 10) + '%';
        txt.style.fontSize = (Math.random() * 40 + 20) + 'px'; txt.style.transform = `rotate(${Math.random() * 40 - 20}deg)`;
        glitchLayer.appendChild(txt);
      }
    }
    generateGlitchFrame();
    glitchInterval = setInterval(generateGlitchFrame, 80);

    setTimeout(() => {
      clearInterval(glitchInterval);
      glitchLayer.style.display = 'none';
      blocksContainer.innerHTML = '';
      glitchLayer.querySelectorAll('.glitch-text').forEach(el => el.remove());
      bigCountdownValue = 100;
      document.getElementById('big-countdown').textContent = "【倒计时：100！】";
      document.getElementById('big-countdown').classList.remove('top-left');
      document.getElementById('big-countdown').classList.add('center');
      document.getElementById('page-tasks').classList.remove('active');
      document.getElementById('page-options').classList.remove('active');
      document.getElementById('page-agreement').classList.add('active');
      protocolBox.scrollTop = 0;
      document.getElementById('hidden-option').style.display = 'none';
      currentTaskIndex = 0;
    }, 2000);
  }
